<!doctype html>
<!-- ARQUIVO TEMPORÁRIO DE TESTE (Claude) — será apagado. Abre o app e liga camadas via ?on=a,b&year=Y -->
<html><body style="margin:0">
<iframe id="f" src="index.html" style="width:1400px;height:850px;border:0"></iframe>
<script>
const q = new URLSearchParams(location.search), f = document.getElementById('f');
f.onload = () => {
  const w = f.contentWindow;
  const go = () => { if (!w.EJ || !w.EJ.globe) return setTimeout(go, 200); setTimeout(apply, 500); };
  go();
  function apply() {
    const off = (q.get('off') || '').split(',').filter(Boolean);
    const on = (q.get('on') || '').split(',').filter(Boolean);
    [...off, ...on].forEach(k => { if ((on.includes(k)) !== w.EJ.globe.layers[k]) w.EJ.globe.toggle(k); });
    if (q.get('ssp')) { w.EJ.scenario = q.get('ssp'); }
    const s = w.document.getElementById('slider'); s.value = q.get('year') || 1880; s.oninput();
  }
};
</script></body></html>
